version: '3'

services:
  proxy:
    image: nginx:latest
    restart: always
    ports:
      - 3182:80
    volumes:
      - ./proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal
    depends_on:
      - bot

  app:
    build:
      context: app
    restart: always
    networks:
      - internal

  bot:
    build:
      context: bot
      args:
        - BROWSER=firefox
    restart: always
    environment:
      APPNAME: Admin
      APPURL: http://proxy/
      APPURLREGEX: ^http(|s)://.*$
      APPFLAG: XMAS{lies_and_deception_basic_charset_byp}
      APPLIMIT: 2
      APPLIMITTIME: 60
      USE_PROXY: 1
      DISPLAY: ${DISPLAY}
    networks:
      - internal
    # uncoment this if you need to run the bot in GUI mode
    # run this before running the docker container if you're use xauth `sudo xhost +local:docker`
    # volumes:
      # - /tmp/.X11-unix:/tmp/.X11-unix
# http://proxy/?param=http://192.168.100.52:1338
networks:
  internal:
